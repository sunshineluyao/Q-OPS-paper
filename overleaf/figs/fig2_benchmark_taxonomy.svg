<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="705" viewBox="0 0 1200 705" role="img" aria-labelledby="title desc">
<title id="title">Five benchmark factor families</title>
<desc id="desc">A branching taxonomy connects the governed human-AI allocation problem to five implemented factor families, each represented with an original technical icon and a concise formula or role.</desc>
