<title id="title">U-W-C-Q dependency lanes</title>
<desc id="desc">Three separated lanes show the classical backbone, the bounded quantum audit, and the acceptance boundary. Every connector is routed through whitespace and the future router is isolated below the implemented flow.</desc>
